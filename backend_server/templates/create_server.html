{% extends "base.html" %}
{% block title %}Create Server{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h1 class="title">Welcome to Crafty AI</h1>
        <p class="subtitle">
            Register a new Minecraft server to generate an API key for the plugin.
        </p>

        <form method="POST" action="{% url 'create_server' %}">
            {% csrf_token %}
            <div class="form-group">
                <label>Server Name</label>
                <input type="text" name="name" placeholder="My SMP Server" required>
            </div>

            <button class="btn btn-primary">
                Create Server & Generate API Key
            </button>
        </form>
    </div>
</div>
{% endblock %}
