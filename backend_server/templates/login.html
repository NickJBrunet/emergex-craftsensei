{% extends "base.html" %}

{% block title %}Login | Crafty{% endblock %}

{% block content %}
<div class="container">
    <div class="card">
        <h1 class="title">Crafty AI</h1>
        <p class="subtitle">Sign in to manage your Minecraft servers</p>

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" required>
            </div>

            <button type="submit" class="btn btn-primary">
                Sign In
            </button>
        </form>
    </div>
</div>
{% endblock %}
