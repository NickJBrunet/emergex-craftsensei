{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Crafty Dashboard{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
</head>
<body>
    <div class="app-wrapper">
        <nav class="navbar">
            <div class="nav-left">
                <span class="logo">Crafty AI</span>
            </div>
            <div class="nav-right">
                <a href="/auth/logout/">Logout</a>
            </div>
        </nav>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
