name: Deploy Django Backend to Cloud Run

on:
  push:
    branches:
      - final-integration
      - dev

env:
  PROJECT_ID: YOUR_PROJECT_ID
  REGION: northamerica-northeast1
  SERVICE: backend
  REPOSITORY: backend
  IMAGE: backend
  CLOUD_SQL_INSTANCE: craftybot-492822:northamerica-northeast1:emergex-db

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/411560433995/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-deployer@craftybot-492822.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> $GITHUB_ENV

      - name: Set image URI
        run: |
          echo "IMAGE_URI=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${IMAGE_TAG}" >> $GITHUB_ENV

      - name: Configure Docker
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build image
        run: docker build -t $IMAGE_URI .

      - name: Push image
        run: docker push $IMAGE_URI

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE \
            --image $IMAGE_URI \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-secrets DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest \
            --set-secrets DATABASE_URL=DATABASE_URL:latest \
            --add-cloudsql-instances $CLOUD_SQL_INSTANCE